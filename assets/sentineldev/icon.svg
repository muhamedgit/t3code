<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- SentinelDev "sonar eye": code brackets around a watchful pupil, over sonar rings. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131c2b"/>
      <stop offset="1" stop-color="#06090e"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cc0ff"/>
      <stop offset="1" stop-color="#0e7ad1"/>
    </linearGradient>
    <radialGradient id="sonar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#2a95ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a95ff" stop-opacity="0.22"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect x="5" y="5" width="1014" height="1014" rx="223" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="4"/>
  <circle cx="512" cy="512" r="300" fill="url(#sonar)"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#2a95ff" stroke-width="14" stroke-opacity="0.35"/>
  <circle cx="512" cy="512" r="390" fill="none" stroke="#2a95ff" stroke-width="10" stroke-opacity="0.18"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 340L180 512L330 684M694 340L844 512L694 684" stroke="#2a95ff" stroke-width="76" opacity="0.45" filter="url(#glow)"/>
    <path d="M330 340L180 512L330 684M694 340L844 512L694 684" stroke="url(#lid)" stroke-width="72"/>
  </g>
  <circle cx="512" cy="512" r="96" fill="#5cb8ff" opacity="0.7" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="78" fill="#eaf5ff"/>
  <rect x="496" y="470" width="32" height="84" rx="10" fill="#0a1220"/>
</svg>
